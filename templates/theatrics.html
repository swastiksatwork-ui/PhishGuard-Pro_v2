<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Threat Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body{
    background:#05070d;
    color:white;
    font-family:Segoe UI;
    padding:20px;
    display:flex;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
  }
  /* soft ambient glow behind the chart, no grid/pattern — just atmosphere */
  body::before{
    content:'';
    position:fixed;
    top:50%; left:50%; transform:translate(-50%,-50%);
    width:1200px; height:1200px;
    background:radial-gradient(circle, rgba(0,255,255,.10), transparent 65%);
    pointer-events:none;
    z-index:0;
  }
  .chart{
    width:100%;
    max-width:1100px;
    aspect-ratio:1 / 1;
    position:relative;
    z-index:1;
    filter:
      drop-shadow(0 0 6px rgba(0,255,255,.65))
      drop-shadow(0 0 18px rgba(0,255,255,.5))
      drop-shadow(0 0 42px rgba(0,255,255,.4))
      drop-shadow(0 0 80px rgba(0,255,255,.25));
  }
  .nav-arrow{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    z-index:50;
    width:56px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(2,9,8,.7);
    border:1px solid rgba(0,255,255,.5);
    border-radius:50%;
    color:#00FFFF;
    text-decoration:none;
    filter:drop-shadow(0 0 6px rgba(0,255,255,.6));
    transition:.25s;
  }
  .nav-arrow:hover{
    background:rgba(0,255,255,.12);
    filter:drop-shadow(0 0 14px rgba(0,255,255,.9));
    transform:translateY(-50%) scale(1.08);
  }
  .nav-arrow svg{
    width:26px;
    height:26px;
  }
  .nav-arrow.left{ left:18px; }
  .nav-arrow.right{ right:18px; }
</style>
</head>

<body>

<a href="/threat_score" class="nav-arrow left" title="Previous">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<a href="/suspicious" class="nav-arrow right" title="Next">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
</a>

<div class="chart">
  <canvas id="radar"></canvas>
</div>

<script>

const ctx = document.getElementById("radar");

async function loadThreatChart() {

    try {

        const response = await fetch("/reports/threat_chart.json", {

            cache: "no-store"

        });

        if (!response.ok) {

            throw new Error("Failed to load threat_chart.json");

        }

        const json = await response.json();

        console.log("Threat Chart JSON:", json);

        new Chart(ctx, {

            type: "radar",

            data: {

                labels: [

                    "Phishing",

                    "Wallet Scam",

                    "Credential Theft",

                    "Malware",

                    "Social Engineering"

                ],

                datasets: [

                {

                    label: "Threat Profile",

                    data: [

                        json.threat_profile.phishing,

                        json.threat_profile.wallet_scam,

                        json.threat_profile.credential_theft,

                        json.threat_profile.malware,

                        json.threat_profile.social_engineering

                    ],

                    backgroundColor: "rgba(0,255,255,0.20)",

                    borderColor: "#00FFFF",

                    borderWidth: 4,

                    pointBackgroundColor: "#ffffff",

                    pointBorderColor: "#00FFFF",

                    pointRadius: 5,

                    pointHoverRadius: 8,

                    pointHoverBackgroundColor: "#00FFFF",

                    pointHoverBorderColor: "#ffffff"

                }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: true,

                plugins: {

                    legend: {

                        labels: {

                            color: "white"

                        }

                    }

                },

                scales: {

                    r: {

                        min: 0,

                        max: 100,

                        ticks: {

                            stepSize: 20,

                            color: "#33e6ff",

                            backdropColor: "transparent"

                        },

                        angleLines: {

                            color: "rgba(51,230,255,0.25)"

                        },

                        grid: {

                            color: "rgba(51,230,255,0.25)"

                        },

                        pointLabels: {

                            color: "white",

                            font: {

                                size: 14

                            }

                        }

                    }

                }

            }

        });

    }

    catch (err) {

        console.error("Threat Chart Error:", err);

        document.body.insertAdjacentHTML(

            "beforeend",

            "<h3 style='color:red'>Failed to load Threat Chart.</h3>"

        );

    }

}

loadThreatChart();

</script>
</body>
</html>
