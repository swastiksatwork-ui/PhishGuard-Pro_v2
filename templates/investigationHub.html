<!DOCTYPE html>
<html>
<head>
<title>Investigation Hub</title>

<style>

body{
background:#05070d;
color:white;
font-family:Segoe UI;
padding:40px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
font-size:50px;
color:cyan;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border:1px solid rgba(0,255,255,.2);
padding:25px;
border-radius:15px;
}

input{
width:100%;
padding:15px;
margin-top:10px;
margin-bottom:20px;
background:#10151d;
border:1px solid cyan;
color:white;
border-radius:8px;
}

button{
padding:15px 25px;
background:cyan;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.feed{
height:300px;
overflow:auto;
}

.log{
padding:10px;
margin-bottom:10px;
border-left:3px solid #00ff88;
background:#0f141d;
}

.verdict-scroll{
height:320px;
overflow-y:auto;
white-space:pre-wrap;
line-height:1.7;
padding-right:10px;
margin-top:10px;
font-family:'Courier New', monospace;
font-size:14px;
position:relative;
}

.verdict-scroll::-webkit-scrollbar{
width:8px;
}

.term-bar{
display:flex;
gap:8px;
margin-bottom:14px;
}

.term-dot{
width:11px;
height:11px;
border-radius:50%;
background:#3a3a3a;
}

.term-dot.on{
background:currentColor;
box-shadow:0 0 6px currentColor;
}

.card-verdict-green, .card-verdict-red{
position:relative;
overflow:hidden;
}

.card-verdict-green::after, .card-verdict-red::after{
content:"";
position:absolute;
inset:0;
background:repeating-linear-gradient(
  0deg,
  rgba(0,0,0,.18) 0px,
  rgba(0,0,0,.18) 1px,
  transparent 1px,
  transparent 3px
);
pointer-events:none;
mix-blend-mode:overlay;
}

@keyframes term-flicker{
0%,96%,100%{ opacity:1; }
97%{ opacity:.6; }
98%{ opacity:.92; }
}

@keyframes cursor-blink{
50%{ opacity:0; }
}

.term-cursor{
display:inline-block;
width:8px;
height:14px;
background:currentColor;
box-shadow:0 0 8px currentColor;
margin-left:2px;
vertical-align:-2px;
animation:cursor-blink 1s steps(1) infinite;
}

.card-verdict-green{
background:
  radial-gradient(circle at 50% 0%, rgba(0,255,102,.12), transparent 60%),
  #05130a;
border:1px solid rgba(0,255,102,.35);
}

.verdict-text-green{
color:#00ff66;
text-shadow:0 0 4px #00ff66, 0 0 12px rgba(0,255,102,.55);
animation:term-flicker 4.5s infinite;
}

.card-verdict-green .verdict-scroll::-webkit-scrollbar-thumb{
background:rgba(0,255,102,.4);
border-radius:4px;
}

.card-verdict-red{
background:
  radial-gradient(circle at 50% 0%, rgba(255,45,45,.12), transparent 60%),
  #170505;
border:1px solid rgba(255,45,45,.35);
}

.verdict-text-red{
color:#ff2d2d;
text-shadow:0 0 4px #ff2d2d, 0 0 12px rgba(255,45,45,.55);
animation:term-flicker 4.5s infinite;
}

.card-verdict-red .verdict-scroll::-webkit-scrollbar-thumb{
background:rgba(255,45,45,.4);
border-radius:4px;
}

.nav-arrow{
position:fixed;
top:50%;
transform:translateY(-50%);
z-index:50;
width:56px;
height:56px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(2,9,8,.7);
border:1px solid rgba(0,255,255,.5);
border-radius:50%;
color:cyan;
text-decoration:none;
filter:drop-shadow(0 0 6px rgba(0,255,255,.6));
transition:.25s;
}
.nav-arrow:hover{
background:rgba(0,255,255,.12);
filter:drop-shadow(0 0 14px rgba(0,255,255,.9));
transform:translateY(-50%) scale(1.08);
}
.nav-arrow svg{
width:26px;
height:26px;
}
.nav-arrow.left{ left:18px; }
.nav-arrow.right{ right:18px; }

</style>
</head>

<body>

<a href="/reports" class="nav-arrow left" title="Previous">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</a>

<a href="/dashboard" class="nav-arrow right" title="Next">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
</a>

<div class="container">

<div class="header">
Threat Investigation Hub
</div>

<div class="grid">

<div class="card card-verdict-green">

<h2>External Input Correlation</h2>

<div class="term-bar" style="color:#00ff66;">
<span class="term-dot on"></span>
<span class="term-dot on"></span>
<span class="term-dot on"></span>
</div>

<div class="verdict-scroll verdict-text-green" id="primary-verdict-text">
Loading<span class="term-cursor"></span>
</div>

</div>

<div class="card card-verdict-red">

<h2>Internal Inspection</h2>

<div class="term-bar" style="color:#ff2d2d;">
<span class="term-dot on"></span>
<span class="term-dot on"></span>
<span class="term-dot on"></span>
</div>

<div class="verdict-scroll verdict-text-red" id="runtime-verdict-text">
Loading<span class="term-cursor"></span>
</div>

</div>

</div>

</div>

<script>

fetch("/reports/primary_verdict.txt", { cache: "no-store" })
  .then(response => {
    if (!response.ok) throw new Error("Failed to load primary_verdict.txt");
    return response.text();
  })
  .then(text => {
    document.getElementById("primary-verdict-text").innerHTML =
      text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") +
      '<span class="term-cursor"></span>';
  })
  .catch(err => {
    console.error(err);
    document.getElementById("primary-verdict-text").innerHTML =
      'Unable to load verdict.<span class="term-cursor"></span>';
  });

fetch("/reports/runtime_verdict.txt", { cache: "no-store" })
  .then(response => {
    if (!response.ok) throw new Error("Failed to load runtime_verdict.txt");
    return response.text();
  })
  .then(text => {
    document.getElementById("runtime-verdict-text").innerHTML =
      text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") +
      '<span class="term-cursor"></span>';
  })
  .catch(err => {
    console.error(err);
    document.getElementById("runtime-verdict-text").innerHTML =
      'Unable to load verdict.<span class="term-cursor"></span>';
  });

</script>

</body>
</html>
